name: Deploy to Netlify
on:
  workflow_dispatch:
    inputs:
      proxy_path:
        description: Temporary Netlify deploy proxy
        required: true
        type: string
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish static site
        env:
          PROXY_PATH: ${{ inputs.proxy_path }}
        run: npx -y @netlify/mcp@latest --site-id 149215eb-c284-46ed-a15e-f4c8b171b15e --proxy-path "$PROXY_PATH"
